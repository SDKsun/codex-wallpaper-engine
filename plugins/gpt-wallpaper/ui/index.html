<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPT 壁纸库</title><link rel="stylesheet" href="/style.css?key=__KEY__"></head>
<body><div id="backdrop"></div><div class="wash"></div><main>
<header><div><small>GPT WALLPAPER · 本地壁纸</small><h1>把喜欢的风景，带进对话。</h1><p>选择壁纸，预览画面，再应用到 Codex。</p></div><button id="manager">启用引擎 / 恢复外观 ↗</button></header>
<section class="glass source"><div class="row"><button id="steam" class="primary">连接 Wallpaper Engine 壁纸库</button><button id="clearScene">退出场景壁纸</button></div><p class="hint">自动读取 Steam 已下载的场景和视频；选中场景即可实时预览鼠标互动。</p><label for="folder">或加载普通壁纸文件夹</label><div class="row"><input id="folder" placeholder="例如 D:\Wallpapers" autocomplete="off"><button id="load">加载壁纸库</button></div><p class="hint">只读取所选目录直属的 JPG、PNG、WebP、MP4、WebM 文件。</p></section>
<div class="workspace"><section class="glass library"><div class="toolbar"><h2>壁纸库 <span id="count">0</span></h2><input id="search" type="search" placeholder="搜索名称"></div><div class="filters" role="group" aria-label="壁纸类型"><button data-filter="all" aria-pressed="true">全部</button><button data-filter="image" aria-pressed="false">图片</button><button data-filter="video" aria-pressed="false">视频</button><button data-filter="scene" aria-pressed="false">场景</button></div><div id="grid"><p class="empty">加载你的壁纸文件夹，风景就从这里开始。</p></div></section>
<aside class="glass"><div id="preview"><p>选择一张壁纸</p></div><h2 id="name">画面预览</h2><p class="hint">这里是壁纸与玻璃面板的预览。聊天界面效果需启用引擎后确认。</p><button id="apply" class="primary wide" disabled>应用到 Codex</button><label class="slider" for="reveal">背景透出度 <output id="value">100%</output></label><input id="reveal" type="range" min="0" max="100" value="100"><button id="saveReveal" class="wide">应用透出度</button><div class="row playback"><button id="pause">暂停</button><button id="resume">播放</button></div><hr><label for="seconds">自动轮播 · 间隔秒数</label><div class="row"><input id="seconds" type="number" min="30" max="86400" value="60"><button id="rotate">开始</button><button id="stop">停止</button></div><p id="rotation" class="hint">轮播未启动</p></aside></div>
<footer class="glass"><p id="message" role="status" aria-live="polite">首次应用：打开“启用引擎”，由管理器引导启用。</p><small>本地 Scene 实时渲染 / 图片 / 视频 · Web 壁纸和系统音频联动尚未接入 · 非 OpenAI 官方插件</small></footer>
</main><script type="module" src="/app.js?key=__KEY__"></script></body></html>
